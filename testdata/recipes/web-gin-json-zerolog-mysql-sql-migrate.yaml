version: v1

project:
  name: orders-api
  module: github.com/example/orders-api
  type: web

go:
  version: "1.25"

layout:
  style: layered

server:
  framework: gin
  port: 8080
  graceful_shutdown: true

configuration:
  format: json

database:
  sql: mysql
  orm_framework: sql
  migrations: migrate
  nosql: none

task_scheduler: none

logging:
  framework: zerolog
  format: json
  request_logging: true

observability:
  health: true
  readiness: true

deployment:
  docker: false
  compose: false

ci:
  github_actions: false
  gitlab_ci: false
  azure_pipelines: false
