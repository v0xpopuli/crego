version: v1

project:
  name: orders-api
  module: github.com/example/orders-api
  type: web

go:
  version: "1.25"

layout:
  style: layered

server:
  framework: echo
  port: 8080
  graceful_shutdown: true

configuration:
  format: toml

database:
  sql: sqlite
  orm_framework: gorm
  migrations: goose
  nosql: none

task_scheduler: none

logging:
  framework: logrus
  format: json
  request_logging: true

observability:
  health: true
  readiness: true

deployment:
  docker: false
  compose: false

ci:
  github_actions: false
  gitlab_ci: false
  azure_pipelines: false
